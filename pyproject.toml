[project]
name = "example"
version = "0.1.0"
description = "An event-driven agent example built with Apixis"
readme = "README.md"
authors = [
    { name = "Justiy", email = "wavejustiy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apixis>=1.1.1",
    "my-llm-py>=1.0.1",
    "rich>=15.0.0",
]

[project.scripts]
example = "example:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
